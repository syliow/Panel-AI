# Give the pods one stable address inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP

  # Send requests to pods with these matching labels.
  selector:
    app.kubernetes.io/name: panel-ai
    app.kubernetes.io/instance: {{ .Release.Name }}

  # Service port 80 forwards to the pod's "http" port (3000).
  ports:
    - name: http
      port: 80
      targetPort: http
