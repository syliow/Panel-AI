# Route requests from the EC2 address to the Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  # Traefik is the ingress controller included with k3s.
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # Match every URL path, including / and /api/health.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
